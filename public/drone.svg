<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Survey drone">
  <defs>
    <!-- Keeps the white airframe readable on pale OSM tiles. -->
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.1" flood-color="#0d1310" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#lift)">
    <!-- Arms -->
    <g stroke="#2f3437" stroke-width="5" stroke-linecap="round">
      <line x1="32" y1="32" x2="15" y2="15"/>
      <line x1="32" y1="32" x2="49" y2="15"/>
      <line x1="32" y1="32" x2="15" y2="49"/>
      <line x1="32" y1="32" x2="49" y2="49"/>
    </g>

    <!-- Rotor discs: two blades per motor, angled so they read as spinning -->
    <g fill="#ffffff" fill-opacity="0.92">
      <g transform="translate(15 14)">
        <ellipse rx="11" ry="2.4" transform="rotate(-24)"/>
        <ellipse rx="11" ry="2.4" transform="rotate(38)"/>
      </g>
      <g transform="translate(49 14)">
        <ellipse rx="11" ry="2.4" transform="rotate(24)"/>
        <ellipse rx="11" ry="2.4" transform="rotate(-38)"/>
      </g>
      <g transform="translate(15 50)">
        <ellipse rx="11" ry="2.4" transform="rotate(24)"/>
        <ellipse rx="11" ry="2.4" transform="rotate(-38)"/>
      </g>
      <g transform="translate(49 50)">
        <ellipse rx="11" ry="2.4" transform="rotate(-24)"/>
        <ellipse rx="11" ry="2.4" transform="rotate(38)"/>
      </g>
    </g>

    <!-- Motor pods -->
    <g fill="#ffffff" stroke="#c9d2cb" stroke-width="0.8">
      <rect x="11.4" y="10.6" width="7.2" height="9.4" rx="3.2"/>
      <rect x="45.4" y="10.6" width="7.2" height="9.4" rx="3.2"/>
      <rect x="11.4" y="46.6" width="7.2" height="9.4" rx="3.2"/>
      <rect x="45.4" y="46.6" width="7.2" height="9.4" rx="3.2"/>
    </g>

    <!-- Fuselage: wider at the shoulders, tapering to the gimbal -->
    <path
      d="M32 13.5c5.6 0 9.4 3.1 9.4 8v14.6c0 5.4-2.6 9.4-5.6 11.4h-7.6c-3-2-5.6-6-5.6-11.4V21.5c0-4.9 3.8-8 9.4-8z"
      fill="#ffffff" stroke="#c9d2cb" stroke-width="0.9"/>
    <!-- Soft shading down the right flank, as in the reference -->
    <path
      d="M38 15.4c2.2 1.4 3.4 3.5 3.4 6.1v14.6c0 5.4-2.6 9.4-5.6 11.4h-2.2c3-2 5.6-6 5.6-11.4V21.5c0-2.6-0.4-4.7-1.2-6.1z"
      fill="#0d1310" fill-opacity="0.07"/>

    <!-- Camera gimbal -->
    <circle cx="32" cy="49.6" r="3.4" fill="#2f3437"/>
    <circle cx="31" cy="48.6" r="1" fill="#ffffff" fill-opacity="0.55"/>
  </g>
</svg>
